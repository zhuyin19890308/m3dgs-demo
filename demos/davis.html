      for(let c=0;c&lt;3;c++)pixels[4*j+c]=(1-ay)*((1-ax)*source[i00+c]+ax*source[i10+c])+ay*((1-ax)*source[i01+c]+ax*source[i11+c]);
      pixels[4*j+3]=255;
    }
    ctx.putImageData(output,0,0);
    if(drag){
      const p=drag.point,tail={x:p.x+sample(DX,p.x,p.y),y:p.y+sample(DY,p.x,p.y)},head=drag.pointer;
      const angle=Math.atan2(head.y-tail.y,head.x-tail.x);
      ctx.strokeStyle=&#x27;#35e9ff&#x27;;ctx.fillStyle=&#x27;#35e9ff&#x27;;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(head.x,head.y);ctx.stroke();
      ctx.beginPath();ctx.arc(tail.x,tail.y,3,0,2*Math.PI);ctx.fill();
      ctx.beginPath();ctx.moveTo(head.x,head.y);ctx.lineTo(head.x-9*Math.cos(angle-0.5),head.y-9*Math.sin(angle-0.5));ctx.lineTo(head.x-9*Math.cos(angle+0.5),head.y-9*Math.sin(angle+0.5));ctx.closePath();ctx.fill();
    }
    status.textContent=`${drag?&#x27;拖拽设定初态&#x27;:paused?&#x27;已暂停&#x27;:&#x27;自由振动&#x27;} · t=${clock.toFixed(2)} s · 最大位移 ${maxMotion.toFixed(1)} px${capped?&#x27;（达到小形变限制）&#x27;:&#x27;&#x27;}`;
  }
  function animate(now){
    const elapsed=Math.max(0,(now-last)/1000);last=now;
    if(!paused&amp;&amp;!drag&amp;&amp;!document.hidden){accumulator+=elapsed;while(accumulator&gt;=config.dt){evolve();accumulator-=config.dt;}}
    else accumulator=0;
    render();requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}
main().catch(error=&gt;{document.getElementById(&#x27;status&#x27;).textContent=&#x27;预览载入失败：&#x27;+String(error);console.error(error);});
